name: images

# Pull requests lint, build every image without pushing and scan each for
# fixable HIGH/CRITICAL vulnerabilities and secrets; main publishes them,
# tagged with the full commit SHA (what consumers pin) and
# <upstream>-dep.<short sha> (readable), each with a provenance attestation.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PREFIX: ghcr.io/ri-scale/dep-dlm-containers
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  check:
    name: lint (hadolint, shellcheck, YAML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: make check

  scan:
    if: github.event_name == 'pull_request'
    name: scan ${{ matrix.image.name }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: rucio-server,  dir: rucio, args: "RUCIO_COMPONENT=server" }
          - { name: rucio-daemons, dir: rucio, args: "RUCIO_COMPONENT=daemons" }
          - { name: fts,           dir: fts,   args: "" }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # amd64 only, from the build job's cache: FTS does not compile again.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.dir }}
          build-args: ${{ matrix.image.args }}
          platforms: linux/amd64
          load: true
          tags: ${{ matrix.image.name }}:dev
          cache-from: type=gha,scope=${{ matrix.image.name }}-amd64
      - uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - run: make scan IMAGE=${{ matrix.image.name }}

  build:
    name: ${{ matrix.image.name }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
        image:
          - { name: rucio-server,  dir: rucio, args: "RUCIO_COMPONENT=server" }
          - { name: rucio-daemons, dir: rucio, args: "RUCIO_COMPONENT=daemons" }
          - { name: fts,           dir: fts,   args: "" }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.dir }}
          build-args: ${{ matrix.image.args }}
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.PREFIX }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch }},mode=max
      - if: env.PUSH == 'true'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - if: env.PUSH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: [check, build]
    name: manifest ${{ matrix.image.name }}
    strategy:
      fail-fast: false
      matrix:
        # version_arg: the Dockerfile ARG holding the upstream version (readable tag)
        image:
          - { name: rucio-server,  dir: rucio, version_arg: RUCIO_VERSION }
          - { name: rucio-daemons, dir: rucio, version_arg: RUCIO_VERSION }
          - { name: fts,           dir: fts,   version_arg: FTS_VERSION }
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - id: upstream
        run: |
          v=$(sed -nE "s/^ARG ${VERSION_ARG}=(.+)$/\1/p" "${DIR}/Dockerfile" | head -1)
          [ -n "$v" ] || { echo "::error::ARG ${VERSION_ARG} not found in ${DIR}/Dockerfile"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
        env:
          VERSION_ARG: ${{ matrix.image.version_arg }}
          DIR: ${{ matrix.image.dir }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.image.name }}-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PREFIX }}/${{ matrix.image.name }}
          tags: |
            type=sha,prefix=,format=long
            type=sha,prefix=${{ steps.upstream.outputs.version }}-dep.,format=short
      - id: manifest
        working-directory: /tmp/digests
        run: |
          ref="${PREFIX}/${IMAGE}"
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${ref}@sha256:%s " *)
          echo "digest=$(docker buildx imagetools inspect "${ref}:${GITHUB_SHA}" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ matrix.image.name }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.PREFIX }}/${{ matrix.image.name }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.PREFIX }}/${{ matrix.image.name }}@${{ steps.manifest.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.PREFIX }}/${{ matrix.image.name }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
